<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etérion - Contos de Elyndra</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="shortcut icon" href="../../imgs/favicon_icon/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../paginas/Elyndra/criaturas.css">
    <style>
        .info-personagens {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-color: #f8f7ef;
        }

        .slider {
            height: 350px;
        }

        .container1 {
            background-image: url(../../imgs/personagens/reis.jpeg);
            background-repeat: no-repeat;
            background-size: 100% 240%;
        }

        @media screen and (max-width: 500px) {
            .navigation-manual {
                margin-top: 320px;
            }

            .navigation-auto {
                margin-top: 320px;
            }
        }
    </style>

</head>

<body>
    <div class="container1">
        <div class="nav-search">
            <figure class="logo">
                <a href="../../index.html"><img class="img-logo" src="../../imgs/elyndra/img-logo.png"
                        alt="logomarca contos de Elyndra.jpeg"></a>
            </figure>
        </div>
    </div>
    <div class="info personagens-info">
        <aside class="menu-esquerdo">
            <ul class="lista-lateral">
                <li title="História" data-bg="../../imgs/elyndra/livro.png"><a href="historia.html"><i
                            class="bi bi-book"></i></a></li>

                <li data-bg="../../imgs/reinos/elyndra-mapa.png" title="Elyndra"><a href="elyndra.html"><i
                            class="bi bi-key"></i></a></li>

                <li data-bg="../../imgs/criaturas/tigre_com_asas2.jpeg" title="Criaturas"><a href="criaturas.html"><i
                            class="bi bi-slack"></i></a></li>

                <li data-bg="../../imgs/personagens/personagens.jpeg" title="Personagens"><a href="#"><i
                            class="bi bi-people"></i></a></li>

                <li data-bg="../../imgs/sobreNos/elyndra-info.jpeg" title="Sobre Nós"><a href="sobreNos.html"><i
                            class="bi bi-info"></i></a></li>
            </ul>
        </aside>
        <section class="info-inicial">
            <h1 class="text-bem-vindo">Personagens</h1>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Consectetur culpa nam aspernatur voluptates,
                consequatur optio accusantium aut maiores id omnis quam dignissimos cumque sit voluptatibus debitis?
            </p>

        </section>
        <div id="img-alterar"></div>
    </div>
    <section class="info-personagens">
        <div class="slider">
            <div class="slides">
                <input type="radio" name="radio-btn" id="radio1">
                <input type="radio" name="radio-btn" id="radio2">
                <input type="radio" name="radio-btn" id="radio3">
                <input type="radio" name="radio-btn" id="radio4">
                <input type="radio" name="radio-btn" id="radio5">


                <div class="slide first">
                    <img src="../../imgs/personagens/p1.jpeg" alt="Personagem 1">
                </div>
                <div class="slide">
                    <img src="../../imgs/personagens/p2.jpeg" alt="Personagem 2">
                </div>
                <div class="slide">
                    <img src="../../imgs/personagens/p3.jpeg" alt="Personagem 3">
                </div>
                <div class="slide">
                    <img src="../../imgs/personagens/p4.jpeg" alt="Personagem 4">
                </div>
                <div class="slide">
                    <img src="../../imgs/personagens/p5.jpeg" alt="Personagem 5">
                </div>

                <div class="navigation-auto">
                    <div class="auto-btn1"></div>
                    <div class="auto-btn2"></div>
                    <div class="auto-btn3"></div>
                    <div class="auto-btn4"></div>
                    <div class="auto-btn5"></div>
                </div>

                <div class="navigation-manual">
                    <label for="radio1" class="manual-btn"></label>
                    <label for="radio2" class="manual-btn"></label>
                    <label for="radio3" class="manual-btn"></label>
                    <label for="radio4" class="manual-btn"></label>
                    <label for="radio5" class="manual-btn"></label>
                </div>
            </div>
    </section>
    <footer class="rodape">Criado por Gouveia K. S.</footer>
    <script src="../../script.js"></script>
</body>

</html>
